[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holographic-source-grammar"
version = "0.1.0"
description = "Reproducible analysis of single-neuron response strength and latency in held-out group stimulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Javier Emilio Bazan Sanchez", email = "bazan@ciencias.unam.mx"},
]
dependencies = [
    "h5py>=3.11,<4",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
